version: "2"

run:
  timeout: 3m

linters:
  default: all
  disable:
    # Not relevant (SQL)
    - sqlclosecheck
    - rowserrcheck
    # Duplicates
    - cyclop
    # Style preferences / too noisy
    - dupl
    - testpackage
    - tparallel
    - paralleltest
    - nlreturn
    - wsl
    - wsl_v5      # same rules as wsl, already disabled
    - exhaustive
    - exhaustruct
    - wrapcheck
    - noctx
    - lll
    - mnd
    - forbidigo
    - varnamelen
    - funcorder
    - nilnil      # fetchRaw intentionally returns nil, nil for "not found, not an error"
    - noinlineerr # style preference — inline err checks are idiomatic in this codebase
    - err113      # our simple validation errors don't need package-level vars
    - gocognit    # generateConfiguration is inherently complex
    - nestif      # nesting is inherent in the provider logic
    - perfsprint  # micro-optimisation not relevant here
    - modernize   # suggestions like interface{}→any don't apply to Go 1.19 target
    - nosprintfhostport  # we include "http://" prefix so net.JoinHostPort doesn't apply cleanly
    - errchkjson         # enc.Encode result is already explicitly discarded with _
    - gocyclo            # generateConfiguration is a large provider function; complexity is expected
    - maintidx           # same reason — provider function complexity is inherent to the domain
    # tagliatelle enforces camelCase JSON tags, but our structs mirror the Forge API
    # which uses snake_case (e.g. ip_address, private_ip_address). Can't change these.
    - tagliatelle

  settings:
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/wickedsick/traefik-laravel-forge
            - github.com/traefik/genconf
    errcheck:
      exclude-functions:
        - (io.Closer).Close
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gocyclo:
      min-complexity: 12
    goconst:
      min-len: 5
      min-occurrences: 4
    misspell:
      locale: US
    funlen:
      lines: -1
      statements: 220
    godox:
      keywords:
        - FIXME
    gofumpt:
      extra-rules: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: (.+)_test.go
      linters:
        - goconst
        - funlen
        - godot
