displayName: Laravel Forge Provider
type: provider

import: github.com/Wicked-Sick-Ltd/traefik-laravel-forge

summary: 'Automatically create Traefik routers from Laravel Forge sites. Configure via tags or config file with auto-IP detection and TLS support.'

testData:
  apiToken: "test-api-token-12345"
  organization: "test-org"
  pollInterval: "30s"
  defaultCertResolver: "letsencrypt"
  defaultSitesEnabled: true
  serverMappings: []
